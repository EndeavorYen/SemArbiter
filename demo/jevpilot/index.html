<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Playable 3D autonomous driving simulator powered by local SemIf semantic decision engine."
    />
    <title>SemIf JevPilot — Playable 3D Autonomous Driving Simulator</title>
    <style>
      #scene-loader{z-index:1000;color:#f1f5f9;text-align:center;background:#0a0d14;place-content:center;justify-items:center;gap:16px;padding:24px;font:14px system-ui,sans-serif;display:grid;position:fixed;inset:50px 0 0}
      #scene-loader[hidden],#scene-loader [hidden]{display:none}
      #scene-loader strong{font-size:20px;font-weight:600;color:#38bdf8}
      #scene-loader p{color:#94a3b8;margin:0}
      .loading-spinner{border:2px solid rgba(56,189,248,0.2);border-top-color:#38bdf8;border-radius:50%;width:24px;height:24px;animation:.9s linear infinite loading-spin}
      #loading-retry{color:#fff;cursor:pointer;background:#0284c7;border:0;border-radius:8px;padding:12px 18px}
      @keyframes loading-spin{to{transform:rotate(360deg)}}
      header.semif-nav{position:fixed;top:0;left:0;right:0;height:50px;background:rgba(10,13,20,0.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(56,189,248,0.2);z-index:2000;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-family:system-ui,sans-serif}
      .semif-brand{font-size:16px;font-weight:800;color:#38bdf8;display:flex;align-items:center;gap:8px;text-decoration:none}
      .semif-badge{font-size:11px;background:rgba(56,189,248,0.15);border:1px solid #38bdf8;padding:2px 8px;border-radius:6px;color:#38bdf8}
      .semif-links{display:flex;gap:18px;font-size:13px;font-weight:600}
      .semif-links a{color:#94a3b8;text-decoration:none;transition:color 0.2s}
      .semif-links a:hover{color:#f1f5f9}
    </style>
    <script type="module" crossorigin src="/jevpilot/assets/index-CranYvkJ.js"></script>
  </head>
  <body class="loading">
    <header class="semif-nav">
      <a href="/jevpilot/" class="semif-brand">
        <span>⚡ SemIf JevPilot</span>
        <span class="semif-badge">RTX 5080 · 12ms</span>
      </a>
      <div class="semif-links">
        <a href="/jevpilot/standalone.html">🎮 Standalone HUD</a>
        <a href="/health" target="_blank">🩺 Server Health</a>
        <a href="https://github.com/EndeavorYen/SemIf" target="_blank">⭐ GitHub Repo</a>
      </div>
    </header>
    <div id="scene-loader" role="status" aria-live="polite">
      <strong>⚡ Loading SemIf JevPilot 3D World…</strong>
      <p id="loading-message">Preparing Cedar Town, Millbrook & Interstate 08…</p>
      <span class="loading-spinner" aria-hidden="true"></span>
      <button id="loading-retry" hidden>Try again</button>
    </div>
    <div id="app" inert aria-busy="true"></div>
  </body>
</html>
